<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Electro Hogar PRO</title>
<meta name="theme-color" content="#0d0f18">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0f18;color:#e4e8f5;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.box{padding:30px;max-width:400px;width:100%}
.logo{font-size:4rem;margin-bottom:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
h1{font-size:1.6rem;font-weight:900;margin-bottom:4px}
h1 span{color:#4f8ef7}
.sub{font-size:.85rem;color:#8b92b3;margin-bottom:28px}
.btn{display:block;width:100%;padding:15px;border-radius:12px;text-decoration:none;font-weight:700;font-size:1rem;margin-bottom:10px;transition:all .2s;border:none;cursor:pointer}
.btn-main{background:#4f8ef7;color:#fff}
.btn-main:active{background:#3a7ae0;transform:scale(.98)}
.btn-tab{background:#1c2030;color:#e4e8f5;border:1px solid #2a2f45}
.btn-tab:active{background:#242840;transform:scale(.98)}
.btn-pc{background:#141720;color:#8b92b3;border:1px solid #2a2f45;font-size:.85rem;padding:11px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;margin-bottom:6px}
.badge-mob{background:rgba(34,212,143,.15);color:#22d48f;border:1px solid rgba(34,212,143,.3)}
.badge-tab{background:rgba(79,142,247,.15);color:#4f8ef7;border:1px solid rgba(79,142,247,.3)}
.badge-pc{background:rgba(139,146,179,.1);color:#8b92b3;border:1px solid rgba(139,146,179,.2)}
.sep{color:#2a2f45;margin:16px 0;font-size:.75rem}
.auto{padding:8px 14px;background:rgba(34,212,143,.1);border:1px solid rgba(34,212,143,.2);border-radius:8px;font-size:.72rem;color:#22d48f;margin-bottom:20px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">⚡</div>
  <h1><span>Electro</span> Hogar PRO</h1>
  <p class="sub">Sistema de gestión de tienda · Reus</p>

  <div class="auto" id="auto-msg">🔍 Detectando tu dispositivo...</div>

  <a href="secondshop_pro_mobile.html" class="btn btn-main" id="btn-recommended">
    📱 Abrir en Móvil
  </a>

  <div class="sep">── otras versiones ──</div>

  <a href="secondshop_pro_tablet.html" class="btn btn-tab">
    <span class="badge badge-tab">📟 TABLET</span><br>
    Versión Tablet
  </a>

  <a href="secondshop_pro.html" class="btn btn-pc">
    <span class="badge badge-pc">💻 PC</span>
    Versión Escritorio
  </a>
</div>

<script>
// Auto-detect device and redirect
const ua = navigator.userAgent;
const w = window.innerWidth;
const isPhone = /Android|iPhone|iPod/.test(ua) || (w < 768);
const isTablet = /iPad/.test(ua) || (w >= 768 && w < 1200 && /Android/.test(ua));
const isPC = !isPhone && !isTablet;

const msg = document.getElementById('auto-msg');
const btn = document.getElementById('btn-recommended');

if(isPhone){
  msg.textContent = '📱 Móvil detectado — redirigiendo...';
  msg.style.background = 'rgba(34,212,143,.1)';
  btn.textContent = '📱 Abrir versión Móvil ← Recomendado';
  btn.style.background = '#22d48f';
  btn.style.color = '#0d0f18';
  // Auto redirect after 1.5s
  setTimeout(()=>{ window.location.href = 'secondshop_pro_mobile.html'; }, 1500);
} else if(isTablet){
  msg.textContent = '📟 Tablet detectada — redirigiendo...';
  msg.style.background = 'rgba(79,142,247,.1)';
  msg.style.color = '#4f8ef7';
  btn.textContent = '📟 Abrir versión Tablet ← Recomendado';
  // Auto redirect after 1.5s
  setTimeout(()=>{ window.location.href = 'secondshop_pro_tablet.html'; }, 1500);
} else {
  msg.textContent = '💻 Ordenador detectado — redirigiendo...';
  msg.style.color = '#8b92b3';
  btn.textContent = '💻 Abrir versión Escritorio ← Recomendado';
  btn.href = 'secondshop_pro.html';
  btn.style.background = '#4f8ef7';
  // Auto redirect after 1.5s
  setTimeout(()=>{ window.location.href = 'secondshop_pro.html'; }, 1500);
}
</script>
</body>
</html>
